<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
       
       .h1{
             display: flex;
             justify-content: center;
           align-items: center;
           height: 90vh;
 
       }
        h1{     
              text-align: center;
               
             font-size: 30px;
        }
        button{
            font-size: 30px;
            font-weight: bold;
        }
        h2{
            font-size: 30px;
        }
    </style>
</head>
<body>
    
<div class="h1">
    <h1>កាដួយម៉ែហែងអាចុយម្រាយ</h1>
            <button popovertarget="my-popover">Click</button>
            <div id="my-popover" popover>
               <h2>Click កាដួយម៉ែហែងអី</h2> 
            </div>
    </div>
    
</div>



    
</body>
</html>
